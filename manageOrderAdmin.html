<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Header Styling */
        header {
            background: #fff;
            padding: 10px 0;
            position: relative;
            display: flex;
            justify-content: flex-start; /* Align content to the left */
            align-items: center; /* Center items vertically */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header img {
            width: 110px;
            height: 110px;
            margin-left: 70px; /* Add margin to the left to give space */
        }

        header h1 {
            margin: 10px 0;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-left: 50px; /* Ensure the title doesn't overlap with the logo */
        }

        /* Button Styling */
        .btn {
            padding: 8px 16px;
            background-color: #dfdbd4;
            color: #333;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 5px;
            margin: 5px;
        }

        .btn:hover {
            background-color: #ddd0c0;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Form Styling */
        .addForm {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 5px;
        }

        .addForm input {
            padding: 8px;
            margin-bottom: 10px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .addForm label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .addForm button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .addForm button:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>

<!-- Header Section -->
<header>
    <div class="logo">
        <img src="img/logo.jpg" alt="Logo">
    </div>
    <h1>Manage Orders</h1>
</header>

<!-- Navigation Buttons -->
<div style="text-align: center; margin-top: 20px;">
    <button class="btn" onclick="exitToDashboard()">Exit to Dashboard</button>
    <button class="btn" onclick="showAddForm()">Add New Order</button>
</div>

<!-- Add/Edit Order Form -->
<div class="addForm" id="addForm">
    <h3 id="formTitle">Add New Order</h3>
    <form id="orderForm">
        <input type="hidden" id="order_id" name="order_id">
        <label>Customer ID:</label><br>
        <input type="text" id="customer_id" name="customer_id"><br><br>

        <label>Customer Name:</label><br>
        <input type="text" id="cust_name" name="cust_name"><br><br>

        <label>Customer Number:</label><br>
        <input type="text" id="cust_num" name="cust_num"><br><br>

        <label>Customer Email:</label><br>
        <input type="email" id="cust_email" name="cust_email"><br><br>

        <label>Address:</label><br>
        <input type="text" id="address" name="address"><br><br>

        <label>Product Name:</label><br>
        <input type="text" id="productName" name="productName"><br><br>

        <label>Product Quantity:</label><br>
        <input type="text" id="productQuantity" name="productQuantity"><br><br>

        <label>Order Date:</label><br>
        <input type="date" id="order_date" name="order_date"><br><br>

        <label>Payment Method:</label><br>
        <input type="text" id="payment_method" name="payment_method"><br><br>

        <label>Delivery Option:</label><br>
        <input type="text" id="delivery_opt" name="delivery_opt"><br><br>

        <label>Total Amount:</label><br>
        <input type="text" id="total_amount" name="total_amount"><br><br>

        <button type="button" class="btn" onclick="saveOrder()">Save Order</button>
        <button type="button" class="btn" onclick="hideAddForm()">Cancel</button>
    </form>
</div>

<!-- Orders Table -->
<table id="ordersTable">
    <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Customer Number</th>
            <th>Customer Email</th>
            <th>Address</th>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Order Date</th>
            <th>Payment Method</th>
            <th>Delivery Option</th>
            <th>Total Amount</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Orders will be loaded here -->
    </tbody>
</table>

<script>
    // Function to show the Add Order form for a new order
    function showAddForm() {
        document.getElementById('addForm').style.display = 'block';
        document.getElementById('formTitle').innerText = 'Add New Order';
        document.getElementById('orderForm').reset(); // Reset the form
        document.getElementById('order_id').value = ''; // Ensure no order ID is present
    }

    // Function to hide the Add/Edit Order form
    function hideAddForm() {
        document.getElementById('addForm').style.display = 'none';
    }

    // Fetch orders from the database
    async function fetchOrders() {
        try {
            const response = await fetch('manageOrderAdmin.php', { method: 'GET' });
            const orders = await response.json();
            const ordersTableBody = document.querySelector('#ordersTable tbody');
            ordersTableBody.innerHTML = ''; // Clear existing table rows

            orders.forEach(order => {
                const row = document.createElement('tr');
                row.innerHTML = ` 
                    <td>${order.order_id}</td>
                    <td>${order.cust_name}</td>
                    <td>${order.cust_num}</td>
                    <td>${order.cust_email}</td>
                    <td>${order.address}</td>
                    <td>${order.productName}</td>
                    <td>${order.productQuantity}</td>
                    <td>${order.order_date}</td>
                    <td>${order.payment_method}</td>
                    <td>${order.delivery_opt}</td>
                    <td>${order.total_amount}</td>
                    <td>
                        <button class="btn" onclick="editOrder(${order.order_id})">Edit</button>
                        <button class="btn" onclick="deleteOrder(${order.order_id})">Delete</button>
                    </td>
                `;
                ordersTableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error fetching orders:', error);
        }
    }

    // Edit an existing order
    async function editOrder(order_id) {
        try {
            const response = await fetch('manageOrderAdmin.php?order_id=' + order_id, { method: 'GET' });
            const order = await response.json();

            if (order) {
                // Populate form fields with the order details
                document.getElementById('order_id').value = order.order_id;
                document.getElementById('customer_id').value = order.customer_id;
                document.getElementById('cust_name').value = order.cust_name;
                document.getElementById('cust_num').value = order.cust_num;
                document.getElementById('cust_email').value = order.cust_email;
                document.getElementById('address').value = order.address;
                document.getElementById('productName').value = order.productName;
                document.getElementById('productQuantity').value = order.productQuantity;
                document.getElementById('order_date').value = order.order_date;
                document.getElementById('payment_method').value = order.payment_method;
                document.getElementById('delivery_opt').value = order.delivery_opt;
                document.getElementById('total_amount').value = order.total_amount;

                // Change form title to "Edit Order"
                document.getElementById('formTitle').innerText = 'Edit Order';
                document.getElementById('addForm').style.display = 'block'; // Show the form
            } else {
                alert('Order not found!');
            }
        } catch (error) {
            console.error('Error editing order:', error);
        }
    }

    // Save order (Add or Edit)
    async function saveOrder() {
        const order = {
            order_id: document.getElementById('order_id').value, // If editing, the order ID is set
            customer_id: document.getElementById('customer_id').value,
            cust_name: document.getElementById('cust_name').value,
            cust_num: document.getElementById('cust_num').value,
            cust_email: document.getElementById('cust_email').value,
            address: document.getElementById('address').value,
            productName: document.getElementById('productName').value,
            productQuantity: document.getElementById('productQuantity').value,
            order_date: document.getElementById('order_date').value,
            payment_method: document.getElementById('payment_method').value,
            delivery_opt: document.getElementById('delivery_opt').value,
            total_amount: document.getElementById('total_amount').value
        };

        try {
            const response = await fetch('manageOrderAdmin.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(order)
            });
            const result = await response.json();
            if (result.success) {
                alert('Order saved successfully!');
                hideAddForm();
                fetchOrders(); // Reload orders table
            } else {
                alert('Error saving order');
            }
        } catch (error) {
            console.error('Error saving order:', error);
        }
    }

    // Delete order
    async function deleteOrder(order_id) {
        if (confirm('Are you sure you want to delete this order?')) {
            try {
                const response = await fetch('manageOrderAdmin.php', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ order_id })
                });
                const result = await response.json();
                if (result.success) {
                    alert('Order deleted successfully!');
                    fetchOrders(); // Reload orders table
                } else {
                    alert('Error deleting order');
                }
            } catch (error) {
                console.error('Error deleting order:', error);
            }
        }
    }

    // Function to navigate to the Dashboard
    function exitToDashboard() {
        window.location.href = 'dashboardAdmin.html'; // Redirect to the dashboard page
    }

    // Initialize the page by fetching orders
    fetchOrders();
</script>

</body>
</html>
